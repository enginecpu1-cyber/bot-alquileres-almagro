name: "Diagnostico ML"
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Probar URLs de ML
        run: |
          cat > diag.js <<'JS'
          const cheerio = require("cheerio");
          const B = "https://inmuebles.mercadolibre.com.ar";
          const urls = {
            "cocheras-style almagro": B + "/cocheras/alquiler/capital-federal/almagro/",
            "deptos almagro simple": B + "/departamentos/alquiler/capital-federal/almagro/",
            "deptos 1-2 amb": B + "/departamentos/alquiler/1-a-2-ambientes/capital-federal/almagro/",
            "deptos 1-2 amb + precio": B + "/departamentos/alquiler/1-a-2-ambientes/capital-federal/almagro/_PriceRange_0ARS-800000ARS",
            "deptos precio solo": B + "/departamentos/alquiler/capital-federal/almagro/_PriceRange_0ARS-800000ARS",
            "deptos con cochera (bot viejo)": B + "/departamentos/alquiler/capital-federal/almagro/_PriceRange_0ARS-750000ARS_Cocheras_1",
          };
          const UAs = { chrome124: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", chrome120: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" };
          (async () => {
            for (const [n, u] of Object.entries(urls)) for (const [un, ua] of Object.entries(UAs)) {
              const r = await fetch(u, { headers: { "User-Agent": ua, "Accept-Language": "es-AR,es;q=0.9" } });
              const b = await r.text();
              const c = cheerio.load(b)("li.ui-search-layout__item").length;
              console.log(`${n} [${un}] -> HTTP ${r.status}, ${b.length}B, tarjetas=${c}, suspicious=${/suspicious-traffic/.test(b)}`);
              await new Promise(r => setTimeout(r, 800));
            }
          })();
          JS
          node diag.js
