name: "Buscar alquileres Almagro"

on:
  schedule:
    - cron: "*/30 * * * *" # respaldo; el disparador real es el Cloudflare Worker
  workflow_dispatch:
    inputs:
      new_chat:
        description: "Chat de Telegram a sumar como destinatario (lo manda el Worker)"
        required: false
        default: ""

permissions:
  contents: write

# Corridas en fila: así un chat sumado por una corrida ya figura en chat_ids.json para la siguiente.
concurrency:
  group: buscar-alquileres
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Chromium headless para Zonaprop (su anti-bot rechaza HTTP simple).
      - name: Cache de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: node scraper.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEW_CHAT_ID: ${{ inputs.new_chat }}

      - name: Guardar estado (avisos enviados, chats, cache de expensas)
        run: |
          git config user.name "bot-alquileres-almagro"
          git config user.email "actions@github.com"
          git add sent_ids.json chat_ids.json expensas_cache.json
          git diff --cached --quiet || git commit -m "Actualiza estado del bot"
          git pull --rebase origin master || true
          git push
